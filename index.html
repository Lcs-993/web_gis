<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebGIS</title>

    <!--
       Cor da barra de endereço no mobile. O valor é trocado
       por js/theme.js a cada mudança de tema.
    -->
    <meta
        name="theme-color"
        id="meta-theme-color"
        content="#f5f5f7"
    >

    <!-- FAVICON (local) -->

    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="assets/favcon_red_green.png">
    <link rel="apple-touch-icon" href="assets/favcon_red_green.png">

    <!-- LEAFLET -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link rel="stylesheet" href="css/style.css?v=20261031">

    <!--
       TEMA — precisa rodar ANTES da primeira pintura da página,
       senão um usuário no modo escuro vê um flash branco. Por isso
       fica inline no head, em vez de esperar o theme.js.
    -->
    <script>
        (function () {
            var theme;

            try {
                var stored = localStorage.getItem("webgis-theme");

                if (stored === "dark" || stored === "light") {
                    theme = stored;
                } else if (window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    theme = "dark";
                } else {
                    theme = "light";
                }
            } catch (error) {
                /* localStorage bloqueado (aba anônima, etc.) */
                theme = "light";
            }

            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>

<body>

    <div class="app">

        <!-- =========================================================
             HEADER
        ========================================================== -->

        <header class="topbar">

            <!-- BRAND -->

            <div class="brand">

                <img
                    class="brand-logo"
                    src="assets/favcon_red_green.png"
                    alt=""
                    width="31"
                    height="31"
                >

                <span class="brand-name">
                    WebGIS
                </span>

            </div>


            <!-- MAIN NAVIGATION -->

            <nav
                class="main-navigation"
                aria-label="Navegação principal"
            >

                <div class="nav-group">

                    <button
                        type="button"
                        class="nav-item"
                        aria-expanded="false"
                        aria-controls="dropdown-camadas"
                    >
                        Camadas
                    </button>

                    <div
                        class="nav-dropdown"
                        id="dropdown-camadas"
                    >
                        <button
                            class="dropdown-item"
                            id="menu-item-talhoes"
                            type="button"
                            aria-pressed="false"
                        >
                            <span class="dropdown-item-label">Talhões</span>
                            <span
                                class="dropdown-item-hint"
                                id="menu-talhoes-hint"
                            >…</span>
                        </button>

                    </div>

                </div>


                <div class="nav-group">

                    <button
                        type="button"
                        class="nav-item"
                        aria-expanded="false"
                        aria-controls="dropdown-consultar"
                    >
                        Análises
                    </button>

                    <div
                        class="nav-dropdown"
                        id="dropdown-consultar"
                    >
                        <a
                            class="dropdown-item"
                            id="menu-previsao"
                            href="#secao-previsao"
                        >
                            <span class="dropdown-item-label">Previsão climática</span>
                        </a>

                        <a class="dropdown-item" href="#">
                            <span class="dropdown-item-label">Resultados da busca</span>
                            <span
                                class="dropdown-item-hint"
                                id="menu-consulta-contagem"
                            >0</span>
                        </a>
                    </div>

                </div>


                <div class="nav-group">

                    <button
                        type="button"
                        class="nav-item"
                        aria-expanded="false"
                        aria-controls="dropdown-ferramentas"
                    >
                        Ferramentas
                    </button>

                    <div
                        class="nav-dropdown"
                        id="dropdown-ferramentas"
                    >
                        <div class="dropdown-item dropdown-item-muted">
                            <span class="dropdown-item-label">Medição e edição</span>
                            <span class="dropdown-item-hint">Em breve</span>
                        </div>

                        <div class="dropdown-divider"></div>

                        <a
                            class="dropdown-item"
                            id="menu-queimadas"
                            href="#secao-queimadas"
                        >
                            <span class="dropdown-item-label">Focos de incêndio</span>
                        </a>

                        <div class="dropdown-divider"></div>

                        <div class="dropdown-item dropdown-item-muted">
                            <span class="dropdown-item-label">Exportações</span>
                            <span class="dropdown-item-hint">Em breve</span>
                        </div>
                    </div>

                </div>


                <div class="nav-group">

                    <button
                        type="button"
                        class="nav-item"
                        aria-expanded="false"
                        aria-controls="dropdown-ajuda"
                    >
                        Ajuda
                    </button>

                    <div
                        class="nav-dropdown"
                        id="dropdown-ajuda"
                    >
                        <div class="dropdown-item dropdown-item-muted">
                            <span class="dropdown-item-label">Documentação</span>
                            <span class="dropdown-item-hint">Em breve</span>
                        </div>
                    </div>

                </div>

            </nav>

            <!-- TEMA -->

            <div class="theme-switch">

                <button
                    class="theme-toggle"
                    id="theme-toggle"
                    type="button"
                    aria-label="Ativar modo escuro"
                    title="Alternar tema"
                >

                    <svg
                        class="theme-icon theme-icon-moon"
                        viewBox="0 0 24 24"
                        fill="none"
                        aria-hidden="true"
                    >
                        <path
                            d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>


                    <svg
                        class="theme-icon theme-icon-sun"
                        viewBox="0 0 24 24"
                        fill="none"
                        aria-hidden="true"
                    >
                        <circle
                            cx="12"
                            cy="12"
                            r="4.2"
                            stroke="currentColor"
                            stroke-width="1.7"
                        />

                        <path
                            d="M12 2.5V5M12 19V21.5M4.6 4.6L6.4 6.4M17.6 17.6L19.4 19.4M2.5 12H5M19 12H21.5M4.6 19.4L6.4 17.6M17.6 6.4L19.4 4.6"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                        />
                    </svg>

                </button>

            </div>


            <!-- USER -->

            <div class="user-menu">

                <button
                    class="user-button"
                    type="button"
                >

                    <span
                        class="user-avatar"
                        aria-hidden="true"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                        >
                            <circle
                                cx="12"
                                cy="8"
                                r="3.2"
                                stroke="currentColor"
                                stroke-width="1.7"
                            />

                            <path
                                d="M5.5 20C6.2 16.4 8.3 14.5 12 14.5C15.7 14.5 17.8 16.4 18.5 20"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                            />
                        </svg>
                    </span>


                    <span class="user-name">
                        Usuário
                    </span>


                    <span
                        class="chevron"
                        aria-hidden="true"
                    >
                        <svg
                            viewBox="0 0 16 16"
                            fill="none"
                        >
                            <path
                                d="M4 6L8 10L12 6"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                    </span>

                </button>

            </div>

        </header>


        <!-- =========================================================
             MAIN / MAP
        ========================================================== -->

        <main class="map-container">

            <!-- BUSCA PRINCIPAL -->

            <div class="search">

                <form
                    class="search-bar"
                    id="forma-busca"
                    role="search"
                >
                    <svg
                        class="search-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        aria-hidden="true"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="7"
                            stroke="currentColor"
                            stroke-width="2"
                        ></circle>
                        <path
                            d="M16.5 16.5L21 21"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        ></path>
                    </svg>

                    <input
                        type="search"
                        class="search-input"
                        id="campo-busca"
                        placeholder="Buscar fazenda, talhão ou proprietário"
                        aria-label="Buscar talhão nos talhões carregados"
                        title="Use fazenda,talhão para selecionar um talhão específico"
                        autocomplete="off"
                        spellcheck="false"
                    >

                    <button
                        class="search-clear"
                        id="busca-limpar"
                        type="button"
                        aria-label="Limpar busca"
                        hidden
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            aria-hidden="true"
                        >
                            <path
                                d="M6 6L18 18M18 6L6 18"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                            ></path>
                        </svg>
                    </button>

                </form>

                <p
                    class="search-feedback"
                    id="busca-feedback"
                    role="status"
                    aria-live="polite"
                    hidden
                ></p>

            </div>

            <!-- SIDEBAR TOGGLE -->

            <button
                class="sidebar-toggle"
                type="button"
                aria-label="Abrir menu lateral"
                aria-expanded="false"
                aria-controls="sidebar"
            >

                <svg
                    class="sidebar-icon-menu"
                    viewBox="0 0 24 24"
                    fill="none"
                    aria-hidden="true"
                >
                    <path
                        d="M4 7H20M4 12H20M4 17H20"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                    />
                </svg>


                <svg
                    class="sidebar-icon-close"
                    viewBox="0 0 24 24"
                    fill="none"
                    aria-hidden="true"
                >
                    <path
                        d="M6 6L18 18M18 6L6 18"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    />
                </svg>

            </button>


            <!-- SIDEBAR -->

            <aside
                id="sidebar"
                class="sidebar"
                aria-label="Painel de camadas"
                aria-hidden="true"
                inert
            >

                <div class="sidebar-header">

                    <span class="sidebar-title">
                        Camadas
                    </span>

                </div>


                <div class="sidebar-body">

                    <section class="sidebar-section">

                        <h2 class="sidebar-section-title">
                            Temas dos talhões
                        </h2>

                        <p class="sidebar-empty">
                            Nenhuma tematização disponível.
                        </p>

                    </section>


                    <section class="sidebar-section">

                        <h2 class="sidebar-section-title">
                            Vector
                        </h2>

                        <label class="sidebar-item">
                            <input
                                type="checkbox"
                                id="layer-talhoes"
                                checked
                            >
                            <span
                                class="sidebar-swatch"
                                style="background:#ffd60a"
                            ></span>
                            <span class="sidebar-item-label">
                                Talhões
                            </span>
                        </label>

                    </section>


                    <!-- MÓDULO: PREVISÃO (conteúdo vem de js/clima.js) -->

                    <section
                        class="sidebar-section modulo"
                        id="secao-previsao"
                        hidden
                    >

                        <h2 class="sidebar-section-title">
                            Previsão
                        </h2>

                        <div id="previsao-conteudo"></div>

                    </section>


                    <!-- MÓDULO: QUEIMADAS (conteúdo vem de js/queimadas.js) -->

                    <section
                        class="sidebar-section modulo"
                        id="secao-queimadas"
                        hidden
                    >

                        <h2 class="sidebar-section-title">
                            Queimadas
                        </h2>

                        <div id="queimadas-conteudo"></div>

                    </section>

                </div>

            </aside>


            <!-- MAP -->

            <div
                class="map-background"
                id="map"
                role="application"
                aria-label="Mapa interativo"
                tabindex="0"
            ></div>


            <!-- MAP STATUS -->

            <div
                class="map-status"
                id="map-status"
                role="status"
                hidden
            ></div>

        </main>


        <!-- =========================================================
             RODAPÉ

             Duas zonas: o estado do mapa à esquerda, as coordenadas
             à direita. O ponto de status, o zoom e a barra de escala
             saíram daqui — a régua era a única coisa que exigia a
             zona central, e sem ela a grade de 3 colunas não se
             justifica mais.
        ========================================================== -->

        <footer
            class="app-footer"
            aria-label="Estado do mapa e coordenadas do cursor"
        >

            <!-- ESQUERDA -->

            <div class="footer-zone footer-left">

                <span class="footer-item footer-status">
                    <strong id="footer-status">Carregando…</strong>
                </span>

            </div>


            <!-- DIREITA -->

            <div class="footer-zone footer-right">

                <span class="footer-item">
                    Lat/Lon:
                    <strong id="footer-coords">—</strong>
                </span>

            </div>


           </footer>

        </div>


        <!-- =========================================================
            JAVASCRIPT
        ========================================================== -->

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <script src="js/theme.js"></script>
        <script src="js/navigation.js"></script>
        <script src="js/map.js"></script>

        <!-- Módulos de análise. csv.js antes dos outros: é o leitor
            compartilhado, e ambos o esperam em window.WebGisCsv. -->
        <script src="js/csv.js"></script>
        <script src="js/clima.js"></script>
        <script src="js/queimadas.js"></script>

    </body>

    </html>
